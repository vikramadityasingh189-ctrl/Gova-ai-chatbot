
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NOVA AI - Your Smart Assistant</title>

<style>
:root {
  --bg: #10111b;
  --panel: #191b2a;
  --text: #f5f5ff;
  --muted: #a5a6ba;
  --accent: #9270ff;
  --bubble: #25283b;
}

body.light {
  --bg: #f5f6fc;
  --panel: #ffffff;
  --text: #202135;
  --muted: #74758a;
  --bubble: #e9e9f5;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  height: 100dvh;
  overflow: hidden;
  transition: .3s;
}

.app {
  display: flex;
  height: 100dvh;
}

.sidebar {
  width: 250px;
  background: var(--panel);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: var(--accent);
  letter-spacing: 1px;
}

.small {
  color: var(--muted);
  font-size: 12px;
  margin-top: 5px;
}

button {
  border: 0;
  cursor: pointer;
  border-radius: 12px;
  padding: 12px;
  font-size: 14px;
}

.newchat {
  background: var(--accent);
  color: white;
  font-weight: bold;
}

.sidebtn {
  background: var(--bubble);
  color: var(--text);
  text-align: left;
}

.sidebar-bottom {
  margin-top: auto;
  display: grid;
  gap: 10px;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.header {
  padding: 18px;
  background: var(--panel);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header h3 {
  font-size: 17px;
}

.status {
  color: #39d99b;
  font-size: 12px;
  margin-top: 4px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 25px 7%;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.welcome {
  margin: auto;
  text-align: center;
  max-width: 550px;
}

.welcome h1 {
  font-size: clamp(28px, 5vw, 43px);
  margin-bottom: 12px;
  background: linear-gradient(90deg,
    #ad8bff, #65d9ed);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

.welcome p {
  color: var(--muted);
  line-height: 1.6;
}

.prompts {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 25px;
}

.prompt {
  background: var(--panel);
  color: var(--text);
  border: 1px solid #7773;
  text-align: left;
  line-height: 1.5;
}

.message {
  max-width: 85%;
  padding: 15px 17px;
  border-radius: 17px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  align-self: flex-end;
  background: var(--accent);
  color: white;
}

.bot {
  align-self: flex-start;
  background: var(--bubble);
  color: var(--text);
}

.input-area {
  background: var(--panel);
  padding: 16px 7% 22px;
}

.inputbox {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bubble);
  border: 1px solid #8885;
  padding: 8px;
  border-radius: 17px;
}

input {
  background: transparent;
  border: 0;
  outline: none;
  color: var(--text);
  flex: 1;
  min-width: 0;
  padding: 12px;
  font-size: 16px;
}

.send {
  background: var(--accent);
  color: white;
  font-size: 18px;
  padding: 12px 17px;
}

.footer {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  margin-top: 10px;
}

.typing {
  color: var(--muted);
  padding: 10px;
}

@media(max-width:650px) {
  .sidebar {
    width: 65px;
    padding: 12px 7px;
    align-items: center;
  }

  .logo {
    font-size: 14px;
  }

  .small, .side-text {
    display: none;
  }

  .sidebar button {
    width: 48px;
    padding: 12px 3px;
    text-align: center;
  }

  .messages {
    padding: 18px 12px;
  }

  .input-area {
    padding: 12px;
  }

  .prompts {
    grid-template-columns: 1fr;
  }

  .message {
    max-width: 94%;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div>
      <div class="logo">NOVA</div>
      <div class="small">AI ASSISTANT</div>
    </div>

    <button class="newchat"
    onclick="newChat()">＋
    <span class="side-text"> New Chat</span>
    </button>

    <button class="sidebtn"
    onclick="showHistory()">◷
    <span class="side-text"> History</span>
    </button>

    <div class="sidebar-bottom">

      <button class="sidebtn"
      onclick="toggleTheme()">◐
      <span class="side-text"> Theme</span>
      </button>

      <button class="sidebtn"
      onclick="clearChat()">⌫
      <span class="side-text"> Clear Chat</span>
      </button>

    </div>

  </aside>

  <main class="main">

    <header class="header">
      <div>
        <h3>NOVA AI Assistant</h3>
        <div class="status">● AI Engine Ready</div>
      </div>
      <span>✦</span>
    </header>

    <section class="messages" id="messages">

      <div class="welcome" id="welcome">

        <h1>Hello, I'm NOVA AI</h1>

        <p>
          Your intelligent assistant. Ask me anything
          and let's explore new ideas together.
        </p>

        <div class="prompts">

          <button class="prompt"
          onclick="usePrompt('Explain artificial intelligence')">
            ✦ Explain Artificial Intelligence
          </button>

          <button class="prompt"
          onclick="usePrompt('Help me with science')">
            ⚗ Science Assistant
          </button>

          <button class="prompt"
          onclick="usePrompt('Write a Python program')">
            💻 Coding Help
          </button>

          <button class="prompt"
          onclick="usePrompt('Give me interesting facts')">
            ✨ Interesting Facts
          </button>

        </div>
      </div>

    </section>

    <section class="input-area">

      <div class="inputbox">

        <input id="userInput"
        type="text"
        placeholder="Message NOVA AI..."
        maxlength="4000"
        onkeydown="if(event.key==='Enter') sendMessage()">

        <button class="send"
        onclick="sendMessage()">➤</button>

      </div>

      <div class="footer">
        NOVA AI can make mistakes. Verify important information.
      </div>

    </section>

  </main>

</div>

<script>

// CUSTOMIZATION 1:
// Paste your actual Cloudflare Worker URL here.

const API_URL = "https://govaibackened.vikramadityasingh189.workers.dev/";

// CUSTOMIZATION 2:
// Change the chatbot name.

const BOT_NAME = "NOVA AI";

let history = [];
let savedChats = [];

const messages = document.getElementById("messages");
const input = document.getElementById("userInput");

function addMessage(text, type) {

  const welcome = document.getElementById("welcome");

  if (welcome) welcome.remove();

  const div = document.createElement("div");

  div.className = "message " + type;
  div.textContent = text;

  messages.appendChild(div);

  messages.scrollTop = messages.scrollHeight;

  return div;
}

async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  if (API_URL === "PASTE_YOUR_WORKER_URL_HERE") {
    addMessage("Please configure your AI backend URL first.", "bot");
    return;
  }

  input.value = "";

  addMessage(text, "user");

  const previousHistory = [...history];

  const typing = addMessage(
    BOT_NAME + " is thinking...",
    "typing"
  );

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text,
        history: previousHistory
      })

    });

    const data = await response.json();

    typing.remove();

    if (!response.ok) {
      throw new Error(data.error || "Request failed.");
    }

    const answer = data.reply || "No response received.";

    addMessage(answer, "bot");

    history.push(
      { role: "user", text: text },
      { role: "model", text: answer }
    );

    saveChat();

  } catch(error) {

    typing.remove();

    addMessage(
      "Connection problem: " + error.message,
      "bot"
    );

  }

}

function usePrompt(text) {

  input.value = text;
  sendMessage();

}

function newChat() {

  history = [];
  messages.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>Hello, I'm NOVA AI</h1>
      <p>Your intelligent assistant. Ask me anything!</p>
    </div>
  `;

}

function clearChat() {

  if (confirm("Clear this conversation?")) {
    newChat();
  }

}

function toggleTheme() {

  document.body.classList.toggle("light");

  localStorage.setItem(
    "novaTheme",
    document.body.classList.contains("light")
      ? "light" : "dark"
  );

}

function saveChat() {

  localStorage.setItem(
    "novaHistory",
    JSON.stringify(history)
  );

}

function showHistory() {

  alert(
    "Your recent conversation is saved in this browser. " +
    "Full chat-history browsing can be added in the next version."
  );

}

const savedTheme = localStorage.getItem("novaTheme");

if (savedTheme === "light") {
  document.body.classList.add("light");
}

</script>

</body>
</html>
